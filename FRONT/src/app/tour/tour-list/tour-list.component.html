<div class="container">
  <div class="tour-grid">

    <div *ngFor="let tour of tours" class="tour-card" (click)="onCardClick(tour.id)">

      <!-- HEADER -->
      <div class="card-header">
        <h3 class="tour-title">{{ tour.title }}</h3>
        <span class="status-badge">{{ tour.status }}</span>
        <button *ngIf="tour.status === tourStatus.PUBLISHED" class="btn-cart" (click)="addToCart($event, tour.id)"
          title="Add to Cart">
          <i class="bi bi-cart-plus-fill">Add to cart</i>
        </button>
      </div>

      <!-- BODY -->
      <div class="card-body">
        <div class="keypoint-info">
          <span class="label">Start:</span>
          <span class="value">{{ getFirstKeypointName(tour) }}</span>
        </div>
        <div class="keypoint-info">
          <span class="label">End:</span>
          <span class="value">{{ getLastKeypointName(tour) }}</span>
        </div>
      </div>

      <!-- FOOTER SA DINAMICKOM OCENOM -->
      <div class="card-footer">

        <!-- Prikazi ako postoji ocena i veca je od 0 -->
        <span class="rating" *ngIf="tourRatings[tour.id!] && tourRatings[tour.id!] > 0">
          Rating: {{ tourRatings[tour.id!] | number:'1.1-1' }} ⭐
        </span>

        <!-- Prikazi ako je ocena 0 ili undefined (jos se ucitava ili nema ocena) -->
        <span class="rating-empty" *ngIf="!tourRatings[tour.id!] || tourRatings[tour.id!] === 0">
          Not yet rated
        </span>

      </div>

    </div>

  </div>
</div>
