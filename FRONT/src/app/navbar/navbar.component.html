<nav class="site-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <!-- LEVA GRUPA (Ostala ista) -->
    <ul class="nav-group nav-group--left">
      <li><a routerLink="/" (click)="onHomeClick()" class="nav-link">Home</a></li>
      <li><a routerLink="/blog" (click)="onBlogClick()" class="nav-link">Blog</a></li>

      <!-- TOURS DROPDOWN -->
      <li class="nav-item dropdown" (mouseenter)="dropdownOpen = true" (mouseleave)="dropdownOpen = false">
        <a class="nav-link" style="cursor: pointer;" (click)="toggleDropdown($event)">
          Tours
        </a>
        <div class="dropdown-menu" [class.show]="dropdownOpen">
          <a class="dropdown-item" routerLink="/tours" (click)="closeDropdown()">Create Tour</a>
          <a class="dropdown-item" routerLink="/tour-list" (click)="closeDropdown()">All Tours</a>
        </div>
      </li>

      <!-- <li><a routerLink="/stakeholders" class="nav-link">Stakeholders</a></li> -->

      <!-- LOCATION SIMULATOR (Samo za Turiste) -->
      <ng-container *ngIf="isLoggedIn && isTourist">
        <li><a routerLink="/location-simulator" class="nav-link" style="color: #e67e22;">Location Simulator</a></li>
      </ng-container>

      <!-- RECOMMENDATIONS (Samo za ulogovane) -->
      <ng-container *ngIf="isLoggedIn">
        <li><a routerLink="/recommendations" class="nav-link">Recommended profiles</a></li>
      </ng-container>

      <ng-container *ngIf="isLoggedIn && isAdmin">
        <li><a routerLink="/admin/users" class="nav-link admin-link">Users</a></li>
      </ng-container>
    </ul>

    <!-- DESNA GRUPA (Ovde je promena) -->
    <ul class="nav-group nav-group--right">

      <!-- AKO NIJE ULOGOVAN: Prikazi Login i Register -->
      <ng-container *ngIf="!isLoggedIn">
        <li><a routerLink="/login" class="btn btn--ghost">Login</a></li>
        <li><a routerLink="/register" class="btn btn--primary">Register</a></li>

      </ng-container>

      <!-- AKO JE ULOGOVAN: Prikazi Profile i Logout -->
      <ng-container *ngIf="isLoggedIn">
        <li><a routerLink="/profile" class="btn btn--ghost">Profile</a></li>
        <li><button (click)="onLogout()" class="btn btn--primary">Logout</button></li>
        <li><a routerLink="/shopping-cart" class="btn btn--primary">Shopping</a></li>
      </ng-container>

    </ul>
  </div>
</nav>
