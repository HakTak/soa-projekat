
services:
  # --- BAZA ZA STAKEHOLDERS ---
  stakeholders-db:
    image: postgres:15
    container_name: stakeholders-db
    environment:
      POSTGRES_DB: stakeholders
      POSTGRES_USER: stakeholders
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stakeholders"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # --- GRAFANA ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - jaeger # Grafana treba da vidi Jaeger
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # --- JAEGER (TRACING) ---
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver (Preporuceno)
      - "4318:4318"   # OTLP HTTP receiver
      - "14268:14268" # Legacy HTTP collector

  # --- API GATEWAY ---
  gateway:
    build: 
      context: .
      dockerfile: API_GATEWAY/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - stakeholders
      - blog
      - auth
      - follower
      - shopping-cart
      - jaeger
    environment:
      - SHOPPING_CART_SERVICE_ADDRESS=shopping-cart:9092
      # Tracing Config
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=gateway
      - OTEL_TRACES_EXPORTER=otlp

  # --- AUTH SERVIS ---
  auth:
    build: 
      context: .
      dockerfile: AUTH/Dockerfile
    container_name: auth
    ports:
      - "8082:8082"
    environment:
      DB_HOST: auth-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth
      DB_PORT: 5432
      # Tracing Config
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
      jaeger:
        condition: service_started

  # --- BAZA ZA AUTH ---
  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- STAKEHOLDERS SERVIS ---
  stakeholders:
    build: 
      context: .
      dockerfile: STAKEHOLDERS/Dockerfile
    container_name: stakeholders
    environment:
      DATABASE_URL: host=stakeholders-db user=stakeholders password=secretpassword dbname=stakeholders port=5432 sslmode=disable
      # Tracing Config
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: stakeholders-service
    depends_on:
      stakeholders-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "8081:8081"
      - "50051:50051"
    
  # --- BLOG SERVIS ---
  blog:
    build: 
      context: .
      dockerfile: BLOG/Dockerfile
    container_name: blog
    ports:
      - "9091:9091"
    volumes:
      - ./BLOG:/src
    environment:
      ASPNETCORE_URLS: "http://+:5251;http://+:9091"
      Kestrel__Endpoints__Grpc__Url: "http://*:9091"
      Kestrel__Endpoints__Grpc__Protocols: "Http2"
      
      MongoDatabaseSettings__ConnectionString: "mongodb://blog-db:27017"
      MongoDatabaseSettings__DatabaseName: "BlogDB"
      
      # Tracing Config
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: blog-service
    depends_on:
      - blog-db
      - jaeger

  # --- BAZA ZA BLOG ---
  blog-db:
    image: mongo:6
    container_name: blog-db
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: BlogDB
    volumes:
      - blog-data:/data/db
    
  # --- TOUR SERVIS ---
  tour:
    build:
      context: .
      dockerfile: TOUR/Dockerfile
    container_name: tour
    ports:
      - "8083:8083"
    environment:
      DB_HOST: tour-db
      DB_USER: tour
      DB_PASSWORD: tourpassword
      DB_NAME: tour
      DB_PORT: 5432
      GRPC_PORT: 50052
      # Tracing Config
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: tour-service
    depends_on:
      tour-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ./TOUR:/src

  tour-db:
    image: postgres:16
    container_name: tour-db
    restart: always
    environment:
      POSTGRES_DB: tour
      POSTGRES_USER: tour
      POSTGRES_PASSWORD: tourpassword
    ports:
      - "5434:5432"
    volumes:
      - tour_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- FOLLOWER SERVIS ---
  follower:
    build: 
      context: .
      dockerfile: FOLLOWER/Dockerfile
    container_name: follower
    ports:
      - 9090:9090
    environment:
      - NEO4J_URI=bolt://follower-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secretpassword
      # Tracing Config
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=follower-service
    depends_on:
      follower-db:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ./FOLLOWER:/src

  follower-db:
    image: neo4j:5.26
    container_name: follower-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/secretpassword
    volumes:
      - follower_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- SHOPPING CART SERVIS ---
  shopping-cart:
    build: 
      context: .
      dockerfile: SHOPPING-CART/Dockerfile
    container_name: shopping-cart
    ports:
      - "9092:9092"
    environment:
      # Database Config
      DB_HOST: shopping-cart-db
      DB_USER: cart
      DB_PASSWORD: cartpassword
      DB_NAME: cart
      DB_PORT: 5432
      # Application Config
      PORT: 9092
      # Tracing Config
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: shopping-cart-service
    depends_on:
      shopping-cart-db:
        condition: service_healthy
      tour:
        condition: service_started
      jaeger:
        condition: service_started
    volumes:
      - ./SHOPPING-CART:/src

  shopping-cart-db:
    image: postgres:16
    container_name: shopping-cart-db
    restart: always
    environment:
      POSTGRES_DB: cart
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cartpassword
    ports:
      - "5435:5432"
    volumes:
      - cart_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  blog-data:
  auth_data:
  pgdata:
  tour_data:
  follower_data:
  cart_data:
  grafana-storage: