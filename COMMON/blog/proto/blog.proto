syntax = "proto3";

package blog;

option go_package = "PROJEKAT/COMMON/blog/proto";
option csharp_namespace = "Blog";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service BlogService {

    // --- POSTS ---

    // HTTP: GET /api/blog/posts
    rpc GetAllPosts (google.protobuf.Empty) returns (GetAllPostsResponse) {
        option (google.api.http) = {
            get: "/api/blog/posts"
        };
    }

    // HTTP: POST /api/blog/posts
    rpc CreatePost (CreatePostRequest) returns (PostResponse) {
        option (google.api.http) = {
            post: "/api/blog/posts"
            body: "*"
        };
    }

    // HTTP: POST /api/blog/posts/{post_id}/like
    // We get UserID from Metadata (X-User-Id), so we only need PostId here
    rpc ToggleLike (ToggleLikeRequest) returns (PostResponse) {
        option (google.api.http) = {
            post: "/api/blog/posts/{post_id}/like"
            body: "*"
        };
    }

    // --- COMMENTS ---

    // HTTP: GET /api/blog/posts/{post_id}/comments
    rpc GetComments (GetCommentsRequest) returns (GetCommentsResponse) {
        option (google.api.http) = {
            get: "/api/blog/posts/{post_id}/comments"
        };
    }

    // HTTP: POST /api/blog/comments
    rpc CreateComment (CreateCommentRequest) returns (CommentResponse) {
        option (google.api.http) = {
            post: "/api/blog/comments"
            body: "*"
        };
    }

    // HTTP: PUT /api/blog/comments/{comment_id}
    rpc UpdateComment (UpdateCommentRequest) returns (CommentResponse) {
        option (google.api.http) = {
            put: "/api/blog/comments/{comment_id}"
            body: "*"
        };
    }

    // HTTP: DELETE /api/blog/comments/{comment_id}
    rpc DeleteComment (DeleteCommentRequest) returns (DeleteCommentResponse) {
        option (google.api.http) = {
            delete: "/api/blog/comments/{comment_id}"
        };
    }
}

// --- MESSAGES ---

message PostResponse {
    string id = 1;
    string title = 2;
    string description = 3;
    repeated string image_paths = 4;
    int32 like_count = 5;
    google.protobuf.Timestamp created_at = 6;
}

message CommentResponse {
    string id = 1;
    string post_id = 2;
    string author_name = 3;
    string author_id = 4;
    string text = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
}

message GetAllPostsResponse {
    repeated PostResponse posts = 1;
}

message CreatePostRequest {
    string title = 1;
    string description = 2;
    repeated string image_paths = 3;
}

message ToggleLikeRequest {
    string post_id = 1;
}

message GetCommentsRequest {
    string post_id = 1;
}

message GetCommentsResponse {
    repeated CommentResponse comments = 1;
}

message CreateCommentRequest {
    string post_id = 1;
    string text = 2;
    // AuthorId and AuthorName will be extracted from JWT in C# code
}

message UpdateCommentRequest {
    string comment_id = 1;
    string text = 2;
}

message DeleteCommentRequest {
    string comment_id = 1;
}

message DeleteCommentResponse {
    bool success = 1;
}