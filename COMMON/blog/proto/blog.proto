syntax = "proto3";

package blog;

option go_package = "PROJEKAT/COMMON/blog/proto";
option csharp_namespace = "Blog";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// =======================
//   MAIN BLOG MODEL
// =======================
message Blog {
    string id = 1;
    string title = 2;
    string description = 3;
    string userName = 4;
    repeated string imagePaths = 5;
    int32 likeCount = 6;
    google.protobuf.Timestamp createdAt = 7;
}

// =======================
//   COMMENT MODEL
// =======================
message Comment {
    string id = 1;
    string postId = 2;
    string authorName = 3;
    string text = 4;
    google.protobuf.Timestamp createdAt = 5;
    google.protobuf.Timestamp updatedAt = 6;
}

// =======================
//   REQUEST / RESPONSE MODELS
// =======================

// ----- Blogs -----
message GetAllBlogsResponse {
    repeated Blog blogs = 1;
}

message CreateBlogRequest {
    Blog blog = 1;
}

message BlogResponse {
    Blog blog = 1;
}

message ToggleLikeRequest {
    string postId = 1;
}

// ----- Comments -----
message GetCommentsRequest {
    string postId = 1;
}

message GetCommentsResponse {
    repeated Comment comments = 1;
}

message CreateCommentRequest {
    Comment comment = 1;
}

message CommentResponse {
    Comment comment = 1;
}

message UpdateCommentRequest {
    Comment comment = 1;
}

message DeleteCommentRequest {
    string commentId = 1;
}

message DeleteCommentResponse {
    bool success = 1;
}

// =======================
//   gRPC SERVICE WITH HTTP ANNOTATIONS
// =======================
service BlogService {

    // HTTP: GET /api/blog/posts
    rpc GetAllPosts (google.protobuf.Empty) returns (GetAllBlogsResponse) {
        option (google.api.http) = {
            get: "/api/blog/posts"
        };
    }

    // HTTP: POST /api/blog/posts
    rpc CreatePost (CreateBlogRequest) returns (BlogResponse) {
        option (google.api.http) = {
            post: "/api/blog/posts"
            body: "*"
        };
    }

    // HTTP: POST /api/blog/posts/toggleLike/{postId}
    // UserId comes from metadata (X-User-Id)
    rpc ToggleLike (ToggleLikeRequest) returns (BlogResponse) {
        option (google.api.http) = {
            post: "/api/blog/posts/toggleLike/{postId}"
            body: "*"
        };
    }

    // --- COMMENTS ---

    // HTTP: GET /api/blog/comments/getAllPostId/{postId}
    rpc GetComments (GetCommentsRequest) returns (GetCommentsResponse) {
        option (google.api.http) = {
            get: "/api/blog/comments/getAllPostId/{postId}"
        };
    }

    // HTTP: POST /api/blog/comments/create
    rpc CreateComment (CreateCommentRequest) returns (CommentResponse) {
        option (google.api.http) = {
            post: "/api/blog/comments/create"
            body: "*"
        };
    }

    // HTTP: PUT /api/blog/comments/edit
    rpc UpdateComment (UpdateCommentRequest) returns (CommentResponse) {
        option (google.api.http) = {
            put: "/api/blog/comments/edit"
            body: "*"
        };
    }

    // HTTP: DELETE /api/blog/comments/{commentId}
    rpc DeleteComment (DeleteCommentRequest) returns (DeleteCommentResponse) {
        option (google.api.http) = {
            delete: "/api/blog/comments/{commentId}"
        };
    }
}