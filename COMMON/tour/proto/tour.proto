syntax = "proto3";

package tour;

option go_package = "PROJEKAT/COMMON/tour/proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// =========================
// ENUMS
// =========================
enum RouteMode {
    WALKING = 0;
    CYCLING = 1;
    DRIVING = 2;
}

enum TourStatus {
    DRAFT = 0;
    PUBLISHED = 1;
    ARCHIVED = 2;
}

// =========================
// MESSAGES
// =========================
message Keypoint {
    string id = 1;
    string tour_id = 2;
    string title = 3;
    double latitude = 4;
    double longitude = 5;
    string description = 6;
    string image_url = 7;
}

message RouteOption {
    string id = 1;
    string tour_id = 2;
    RouteMode mode = 3;
    int64 duration = 4; // in milliseconds
}

message Tour {
    string id = 1;
    string user_name = 2;
    string title = 3;
    string description = 4;
    string difficulty = 5;
    string tags = 6;
    TourStatus status = 7;
    double price = 8;
    double distance = 9;
    int64 duration = 10; // in milliseconds
    google.protobuf.Timestamp created_at = 11;
    google.protobuf.Timestamp published_at = 12;
    google.protobuf.Timestamp archived_at = 13;
    repeated Keypoint keypoints = 14;
    repeated RouteOption route_options = 15;
}

message Review {
    string id = 1;
    string tour_id = 2;
    string user_name = 3;
    int32 rating = 4;
    string comment = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp visited_at = 7;
    string image_url = 8;
}

// =========================
// REQUEST MESSAGES
// =========================
message CreateTourRequest {
    Tour tour = 1;
}

message UpdateTourRequest {
    Tour tour = 1;
}

message GetTourRequest {
    string id = 1;
}

message GetToursByUserRequest {
    string user_name = 1;
}

message DeleteTourRequest {
    string id = 1;
}

message CreateReviewRequest {
    Review review = 1;
}

message GetReviewsByTourRequest {
    string tour_id = 1;
}

message DeleteReviewRequest {
    string id = 1;
}

// =========================
// RESPONSE WRAPPERS
// =========================
message TourResponse {
    Tour tour = 1;
}

message GetAllToursResponse {
    repeated Tour tours = 1;
}

message ReviewResponse {
    Review review = 1;
}

message GetAllReviewsResponse {
    repeated Review reviews = 1;
}

message TouristPosition {
    float lat = 1;
    float lng = 2; 
}

message ActivateTourRequest{
    string tour_id = 1;
    string tourist_id = 2;
    TouristPosition current_position = 3;
}

message TourExecutionResponse{
    string id = 1;
    string tour_id = 2;
    string tourist_id = 3;
    TourExecutionStatus status = 4;                     // Enum definisan ispod
    google.protobuf.Timestamp started_at = 5;           // time.Time
    google.protobuf.Timestamp last_activity_at = 6;
    google.protobuf.Timestamp finished_at = 7;
    repeated CompletedKeypoint completed_key_points = 8; // Slice [] se mapira u repeated
    TouristPosition current_position = 9;
}

// Enum za status (prilagodi vrednosti onome što imaš u Go kodu)
enum TourExecutionStatus {
    TOUR_EXECUTION_STATUS_UNKNOWN = 0; // Proto3 zahteva da prvi enum bude 0
    TOUR_EXECUTION_STATUS_ACTIVE = 1;
    TOUR_EXECUTION_STATUS_FINISHED = 2;
    TOUR_EXECUTION_STATUS_ABANDONED = 3;
}

// Pretpostavljena struktura za CompletedKeypoint
message CompletedKeypoint {
    string keypoint_id = 1;
    google.protobuf.Timestamp completed_at = 2;
}

message TourExecutionByTourUserRequest {
    string tour_id = 1;
    string tourist_id = 2;
}


message AbandonTourExecutionRequest{
    string id = 1;
}


message SetCurrentLocationRequest{
    string tourist_id = 1;
    TouristPosition current_position = 2;
}

message SetCurrentLocationResponse{
    int32 changed_number = 1;
}

message CheckCloseKeyPointsRequest{
    string id = 1;
    string tourId = 2;
}


// =========================
// SERVICE WITH ANNOTATIONS
// =========================
service TourService {
    // Tours
    rpc CreateTour(CreateTourRequest) returns (TourResponse) {
        option (google.api.http) = {
            post: "/tour"
            body: "tour"
        };
    }

    rpc GetTour(GetTourRequest) returns (TourResponse) {
        option (google.api.http) = {
            get: "/tour/{id}"
        };
    }

    rpc GetAllTours(google.protobuf.Empty) returns (GetAllToursResponse) {
        option (google.api.http) = {
            get: "/tours"
        };
    }

    rpc GetToursByUser(GetToursByUserRequest) returns (GetAllToursResponse) {
        option (google.api.http) = {
            get: "/tours/myTours/{user_name}"
        };
    }

    rpc UpdateTour(UpdateTourRequest) returns (TourResponse) {
        option (google.api.http) = {
            patch: "/tour/update"
            body: "tour"
        };
    }

    rpc DeleteTour(DeleteTourRequest) returns (TourResponse) {
        option (google.api.http) = {
            delete: "/tour/{id}"
        };
    }

    // Reviews
    rpc CreateReview(CreateReviewRequest) returns (ReviewResponse) {
        option (google.api.http) = {
            post: "/review/create"
            body: "review"
        };
    }

    rpc GetReviewsByTour(GetReviewsByTourRequest) returns (GetAllReviewsResponse) {
        option (google.api.http) = {
            get: "/review/tour/{tour_id}"
        };
    }

    rpc GetAllReviews(google.protobuf.Empty) returns (GetAllReviewsResponse) {
        option (google.api.http) = {
            get: "/review/getAll"
        };
    }

    rpc DeleteReview(DeleteReviewRequest) returns (ReviewResponse) {
        option (google.api.http) = {
            delete: "/review/delete/{id}"
        };
    }

    rpc ActivateTour(ActivateTourRequest) returns (TourExecutionResponse){
        option (google.api.http) = {
            post: "/tourExecute"
            body: "*"
        };
    }

    rpc GetTourExecutionByTourUser(TourExecutionByTourUserRequest) returns (TourExecutionResponse){
        option (google.api.http) = {
            get: "/tourExecute"
        };
    }

    rpc AbandonTourExecution(AbandonTourExecutionRequest) returns (TourExecutionResponse){
        option (google.api.http) = {
            post: "/tourExecute/abandon"
            body: "*"
        };
    }

    rpc SetCurrentLocation(SetCurrentLocationRequest) returns (SetCurrentLocationResponse){
        option (google.api.http) = {
            put: "/tourExecute/currentLocation"
            body: "*"
        };
    }

    rpc CheckCloseKeyPoints(CheckCloseKeyPointsRequest) returns (TourExecutionResponse){
        option (google.api.http) = {
            put: "/tourExecute/check"
            body: "*"
        };
    }
}
