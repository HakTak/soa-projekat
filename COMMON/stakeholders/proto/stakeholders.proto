syntax = "proto3";

package stakeholders;

option go_package = "PROJEKAT/COMMON/stakeholders/proto";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service StakeholdersService {
    
    // 1. INTERNA METODA (Koristi je Auth servis)
    rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse) {}
    
    // 2. GET PROFILE (Javna/Zaštićena)
    // GET /api/stakeholders/profiles/{user_id}
    rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
        option (google.api.http) = {
            get: "/api/stakeholders/profiles/{user_id}"
        };
    }

    // 3. GET MY PROFILE (Za ulogovanog korisnika)
    // GET /api/stakeholders/profiles/me
    rpc GetMyProfile(google.protobuf.Empty) returns (GetProfileResponse) {
        option (google.api.http) = {
            get: "/api/stakeholders/profiles/me"
        };
    }

    // 4. UPDATE MY PROFILE
    // PUT /api/stakeholders/profiles/me
    rpc UpdateMyProfile(UpdateProfileRequest) returns (GetProfileResponse) {
        option (google.api.http) = {
            put: "/api/stakeholders/profiles/me"
            body: "*"
        };
    }

    // 5. BLOCK USER (Admin only)
    // POST /api/stakeholders/profiles/{user_id}/block
    rpc BlockUser(BlockUserRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post: "/api/stakeholders/profiles/{user_id}/block"
            body: "*" // Iako je body prazan, mora da stoji * za POST
        };
    }
}

// --- PORUKE ---

enum Role {
    ROLE_UNKNOWN = 0; 
    ROLE_GUIDE   = 1;
    ROLE_TOURIST = 2;
    ROLE_ADMIN   = 3;
}

message CreateProfileRequest {
    string user_id = 1;
    Role role = 2;
}

message CreateProfileResponse {
    string id = 1;
    bool already_existed = 2;
}

message GetProfileRequest {
    string user_id = 1;
}

message GetProfileResponse {
    string id = 1;
    string user_id = 2;
    string first_name = 3;
    string last_name = 4;
    Role role = 5;
    string profile_picture = 6;
    string biography = 7;
    string motto = 8;
    bool is_blocked = 9;
}

message UpdateProfileRequest {
    string first_name = 1;
    string last_name = 2;
    string profile_picture = 3;
    string biography = 4;
    string motto = 5;
    // Role se ne menja ovde
}

message BlockUserRequest {
    string user_id = 1;
}